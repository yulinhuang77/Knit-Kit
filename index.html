  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function () {
        try {
          var ipad = /iPad/.test(navigator.userAgent) ||
            (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
          if (!ipad) return;

          var editing = null;
          var originalValue = '';

          function isRowHeightInput(target) {
            var label = target && target.closest && target.closest('label');
            return target && target.tagName === 'INPUT' && target.type === 'number' &&
              label && label.textContent.indexOf('1排高度') !== -1;
          }

          document.addEventListener('focusin', function (event) {
            if (!isRowHeightInput(event.target)) return;
            editing = event.target;
            originalValue = editing.value;
            editing.setAttribute('inputmode', 'decimal');
          }, true);

          document.addEventListener('input', function (event) {
            if (event.target === editing) event.stopImmediatePropagation();
          }, true);

          document.addEventListener('focusout', function (event) {
            if (event.target !== editing) return;
            var input = editing;
            editing = null;
            if (!isFinite(input.valueAsNumber) || input.valueAsNumber < 0.1) {
              input.value = originalValue;
            }
            input.dispatchEvent(new Event('input', { bubbles: true }));
          }, true);
        } catch (_) {
          // Compatibility code must never prevent the main application loading.
        }
      });
    </script>
  </body>
